 {t:'DECEPTION · 0:00–1:15',q:'“Does this influencer really have life all figured out? What might be happening outside the frame?”',p:'A highlight reel is not the whole truth. Deception can make comparison feel like reality. Tap “Behind the post” to show the other side.'},

 {t:'DISTRACTION · 2:25–3:35',q:'“Have you ever opened your phone to do one thing and forgotten why you opened it?”',p:'Distraction can be funny and harmless, but it can crowd out prayer, relationships, and quiet. Randy W.’s messages are also deliberately interrupting our scrolling.'},
 {t:'FOCUS · 3:35–4:20',q:'“If we make space for a notification, can we make space for God?”',p:'Tap Silence notifications, then Start Gospel Focus. The Spirit is not controlled by a button; the button illustrates intentional choices.'},
 {t:'GOSPEL LIBRARY · 4:20–5:20',q:'“How can you recognize the Spirit? What thoughts and feelings invite you to do good?”',p:'Read Doctrine and Covenants 8:2 and 2 Nephi 32:9. Revelation may come to mind and heart. Prayer and scriptures help us become more receptive.'},
 {t:'LISTEN · 5:20–5:45',q:'“What is one thing Heavenly Father may want you to do this week?”',p:'Start 15 seconds of silence. Do not promise a dramatic feeling. Sometimes the answer is a peaceful idea or a desire to do something good.'},
 {t:'YOUR INVITATION · 5:45–6:30',q:'“What one small change could make it easier to hear and feel the Spirit?”',p:'Let a youth choose a seven-day habit. Close with testimony: God wants to communicate with you and will help as you seek Him.'}
];

 {user:'aria.bloom',sub:'Bali, Indonesia · Sponsored',avatar:'influencer',emoji:'🌺',likes:'82,417',name:'DECEPTION',caption:'<b class="username">aria.bloom</b> Everything is perfect. 5 AM workouts, 6 businesses, zero stress. If I did it, why can’t you? ✨💸',comments:'View all 1,280 comments'},

 {user:'brainrot.daily',sub:'Original meme · For You',avatar:'meme',emoji:'🦝',likes:'451,009',name:'DISTRACTION',caption:'<b class="username">brainrot.daily</b> You went to watch one video. You now have a PhD in raccoon driver education. 🦝🚗',comments:'View all 4,882 comments'}

function renderFeed(i){const p=posts[i];return `<section class="view feedView">${status()}<div class="topbar"><div class="logo">loop<span class="logoDot">.</span></div><div class="topActions"><button class="iconBtn" data-action="tip" aria-label="Presenter's notes">${ico.comment}</button><button class="iconBtn" data-action="messages" aria-label="View Randy W.'s messages">${ico.heart}</button></div></div>${stories()}<div class="postAuthor"><div class="avatar ${p.avatar}">${p.emoji}</div><div><div class="authorName">${p.user} <span class="verified">✹</span></div><div class="authorSub">${p.sub}</div></div><div class="postCounter">${i+1} / 3</div></div><div class="postMedia" id="postMedia">${i===0?luxuryArt():i===1?futureArt():memeArt()}${i!==2?`<div class="mediaTag">THE THREE D'S · ${p.name}</div>`:""}${i===0?`<button class="seeTruth ${S.truth?'on':''}" data-action="truth">${S.truth?'✓ Reality check':'👀 Behind the post'}</button>${S.truth?`<div class="hiddenTruth"><b>WHAT YOU DIDN’T SEE</b><span>This is a staged highlight reel. The photo, perfect life, and effortless success are carefully curated. Comparison leaves out the whole story.</span></div>`:''}`:''}${i===1?`${S.comments?`<div class="commentsOverlay"><b>WHAT'S IN THE COMMENTS</b><p><span>@futurekid:</span> “We’re so cooked.”</p><p><span>@wishful:</span> “I guess there’s no point in trying.”</p><p>Fear gets clicks. A scary prediction isn’t your destiny.</p><button data-action="comments">Close comments</button></div>`:`<button class="clickHint" data-action="comments">💬 Read the comments</button>`}`:''}</div><div class="postActionbar"><button class="${S.like[i]?'liked':''}" data-action="like" aria-label="Like post">${ico.heart}</button><button data-action="comments" aria-label="View comments">${ico.comment}</button><button data-action="share" aria-label="Share post">${ico.send}</button><button class="save" data-action="save" aria-label="Save post">${ico.save}</button></div><div class="caption"><div style="font-weight:850;font-size:11px;margin-bottom:3px">${p.likes} likes</div><div class="headline">${p.caption}</div><div class="readComments">${p.comments}</div></div><div class="swipeNudge"><button data-action="next">SWIPE UP FOR NEXT ${i===2?'· FOCUS MODE':'POST'} <span style="font-size:16px">↑</span></button></div><div class="bottomNav"><button data-action="home" aria-label="Home">${ico.home}</button><button data-action="search" aria-label="Search">${ico.search}</button><button data-action="next" aria-label="Next reel">${ico.reel}</button><button data-action="messages" aria-label="Messages">${ico.send}</button><button data-action="profile" aria-label="Profile"><div class="navProfile"></div></button></div></section>`}
function renderFocus(){return `<section class="view focusView">${status()}<div class="iosControlHeader"><span>CONTROL CENTER</span><span>● Privacy</span></div><div class="iosMiniGrid"><div class="iosMini"><span>◉</span> Wi-Fi</div><div class="iosMini"><span>ᛒ</span> Bluetooth</div><div class="iosMini"><span>☀</span> Display</div></div><div class="focusHero">FOCUS · HEAR HIM</div><h1 class="focusHeading">Less noise.<br><em>More room to listen.</em></h1><p class="focusCopy">Our phones have Focus Modes. What would a spiritual one look like?</p><div class="controlPanel"><button class="controlTile big ${S.focus[0]?'on':''}" data-action="togglefocus" data-id="0"><span><b>☾ Do Not Disturb</b><small>${S.focus[0]?'On · Notifications silenced':'Tap to silence interruptions'}</small></span><span class="tileIcon">${S.focus[0]?'✓':'☾'}</span></button><button class="controlTile ${S.focus[1]?'on':''}" data-action="togglefocus" data-id="1"><span class="tileIcon">📖</span><span><b>Scripture</b><small>${S.focus[1]?'Study time set':'Make time to read'}</small></span></button><button class="controlTile" data-action="pray"><span class="tileIcon">🙏</span><span><b>Prayer</b><small>Ask. Pause. Listen.</small></span></button></div><div class="focusResult">${S.focus[0]?'✓ Notifications quieted. ':''}${S.focus[1]?'✓ Scripture time set.':''}</div><button class="focusStart" data-action="openhome">Go to Home Screen →</button><p class="focusFoot">Spiritual Focus is a metaphor: the Spirit isn't controlled by a switch.</p></section>`}
function renderHome(){return `<section class="view homeView">${status()}<div class="homeTopTag">☾ ${S.focus[0]?'Do Not Disturb On':'Spiritual Focus'}</div><div class="iosHomeWidgets"><div class="iosHomeWidget calWidget"><span class="widgetSmall">SATURDAY</span><span class="widgetBig">24</span><span class="widgetMini">🏈 BYU vs. UCF</span></div><div class="iosHomeWidget focusWidget"><span class="widgetSmall">FOCUS</span><span class="widgetMoon">☾</span><span class="widgetMini">${S.focus[0]?'Notifications Silenced':'Time to Listen'}</span></div></div><div class="iosHomeAppsLabel">APPS</div><div class="homeApps"><button class="homeAppBtn" data-action="openlibrary"><span class="appIcon gospel"></span><span class="appName">Gospel Library</span></button><button class="homeAppBtn" data-action="blocked"><span class="appIcon loopIcon">♡</span><span class="appName">Loop</span></button><button class="homeAppBtn" data-action="messages"><span class="appIcon msgIcon">💬</span><span class="appName">Messages</span></button><button class="homeAppBtn" data-action="blocked"><span class="appIcon notesIcon">🌅</span><span class="appName">Photos</span></button><button class="homeAppBtn" data-action="blocked"><span class="appIcon notesIcon" style="color:#eba700">▤</span><span class="appName">Notes</span></button><button class="homeAppBtn" data-action="blocked"><span class="appIcon" style="background:#222631">📷</span><span class="appName">Camera</span></button><button class="homeAppBtn" data-action="blocked"><span class="appIcon" style="background:#fff;color:#3689d8">◉</span><span class="appName">Safari</span></button><button class="homeAppBtn" data-action="blocked"><span class="appIcon" style="background:#ec5558">♫</span><span class="appName">Music</span></button></div><div class="homeSpacer"></div><p class="homeTip">Tap <b>Gospel Library</b> to choose a different kind of feed.</p><div class="homeDock"><span class="dockIcon" style="background:#59d569">☎</span><span class="dockIcon" style="background:#fff;color:#1485cf">◉</span><span class="dockIcon" style="background:#62ce75">✉</span><span class="dockIcon" style="background:#ef6d7c">♫</span></div></section>`}
function renderLibrary(){return `<section class="view libraryView">${status(true)}<div class="libraryNav"><button data-action="backhome">‹ Home</button><b>Gospel Library</b><button data-action="tip">•••</button></div><div class="libBanner"><small>STUDY · HEAR HIM</small><div class="libHeadline">Make space<br>for His voice.</div><svg width="155" height="155" viewBox="0 0 150 150"><circle cx="93" cy="83" r="55" fill="#b6dacf" opacity=".18"/><path d="M28 113q28-32 54 0 26-28 49 0v16q-25-23-49 1-26-23-54-1Z" fill="#e0f6e8" opacity=".63"/><path d="M78 68v50" stroke="#f7ffe9" stroke-width="3"/></svg></div><div class="libBody"><div class="libLabel">TODAY'S SCRIPTURE STUDY</div><div class="scripture"><h3>Doctrine and Covenants 8:2</h3><p>“I will tell you <span class="highlight">in your mind and in your heart</span>, by the Holy Ghost.”</p></div><div class="scripture"><h3>2 Nephi 32:9</h3><p>“Ye must <span class="highlight">pray always, and not faint.</span>”</p></div><div class="libPrompt">🕊️ <b>Something to notice:</b> The Spirit can prompt good thoughts, peace, truth, and a desire to act. We may recognize those impressions as we study, pray, and practice.</div><button class="libAction" data-action="reflect">🙏 Pause and listen for 15 seconds →</button></div><div class="libTabs"><div class="libTab active"><div class="libTabIcon">⌂</div>Home</div><div class="libTab"><div class="libTabIcon">▤</div>Scriptures</div><div class="libTab"><div class="libTabIcon">◻</div>Library</div><div class="libTab"><div class="libTabIcon">⌕</div>Search</div></div></section>`}
function renderReflect(){return `<section class="view reflectView">${status()}<div class="reflectIcon">🕊️</div><h1 class="reflectTitle">Be still. Listen.</h1><p class="reflectLead">What is one change that would make it easier for you to hear and feel the Spirit this week?</p><div class="timerOuter" id="timerOuter" style="--amount:${((15-S.seconds)/15)*100}%"><div class="timerInner"><div class="timerNum" id="timerNum">${S.seconds}</div><div class="timerUnit" id="timerUnit">${S.seconds===0?'COMPLETE':'SECONDS'}</div></div></div><button class="reflectBtn" data-action="timer">${S.running?'Listening…':S.seconds===0?'Continue →':'Start 15-second quiet moment'}</button><button style="font-size:12px;color:#d5ecef;margin-top:13px" data-action="commit">Skip to 7-day invitation →</button><div class="reflectNote">You may not feel something dramatic. God can guide us through quiet impressions, thoughts, and actions over time.</div></section>`}
function renderCommit(){const opts=['📵 Wait 5 minutes before opening social media','📖 Read one verse before I scroll','🙏 Pray, then pause and listen','🔕 Silence one distracting notification'];return `<section class="view commitView">${status()}<div class="commitEyebrow">YOUR 7-DAY CHALLENGE</div><h1 class="commitTitle">Make room<br>to <i>hear Him.</i></h1><p class="commitText">Choose one realistic change that could help you recognize the Spirit more clearly this week.</p>${opts.map((x,i)=>`<button class="choice ${S.selection===i?'active':''}" data-action="choose" data-id="${i}"><span class="check">${S.selection===i?'✓':''}</span>${x}</button>`).join('')}<div class="commitFinal">God wants to communicate<br>with you.</div><div class="commitSub">Our job is to make room and listen.</div><button class="restart" data-action="reset">↻ Restart the demonstration</button></section>`}
function render(){let html;if(S.scene<=2)html=renderFeed(S.scene);else if(S.scene===3)html=renderFocus();else if(S.scene===4)html=renderHome();else if(S.scene===5)html=renderLibrary();else if(S.scene===6)html=renderReflect();else html=renderCommit();$('#screen').innerHTML=html;renderOverlay()}
function renderOverlay(){let h='';if(S.banner>=0&&!S.messages&&!S.focus[0]){const txt=texts[S.banner];h+=`<div class="banner" role="alert" aria-label="Text message from Randy W."><span class="bannerAvatar"><img class="randyPortrait" src="./randy-w.png" alt="Randy W."></span><span class="bannerMain"><span class="bannerMeta"><span>MESSAGES</span><span>now</span></span><div class="bannerSender">Randy W.</div><div class="bannerText">${txt}</div></span><button class="bannerClose" data-action="dismiss" aria-label="Dismiss message">×</button><button class="bannerClick" data-action="messages" aria-label="Open Randy W.'s messages"></button></div>`}
if(S.messages){let n=Math.max(0,S.scene===0?0:Math.min(S.scene-1,2));h+=`<div class="modalScrim"><div class="iosMessages" role="dialog" aria-modal="true" aria-label="Messages with Randy W.">${status(true)}<div class="iosMsgNav"><button class="iosMsgBack" data-action="closemessages">‹ Loop</button><div class="iosMsgPerson"><div class="iosMsgAvatar"><img class="randyPortrait" src="./randy-w.png" alt="Randy W."></div><b>Randy W. ﹀</b></div><span class="iosMsgInfo">ⓘ</span></div><div class="iosChat"><div style="text-align:center;color:#8f9096;font-size:11px">Today 9:41 AM</div><div class="bubble">How are we looking on the BYU game? 👀</div>${texts.slice(0,n+1).map((t,i)=>`<div class="bubble"><small>Randy W. · ${i+1} min ago</small>${t}</div>`).join('')}<div class="bubble fakeReply">I'm literally teaching a lesson on distraction right now 😂</div></div><div class="iosMsgInput"><span>⊕</span><span class="inputPill">iMessage</span><span>🎤</span></div></div></div>`}
if(S.tips){const t=tips[Math.min(S.scene,6)];h+=`<div class="tipPanel"><b>🎤 ${t.t}</b><p><b>ASK:</b> ${t.q}</p><p><b>POINT:</b> ${t.p}</p><button data-action="tip">Close presenter notes</button></div>`}
if(S.toast)h+=`<div class="overlayToast">${S.toast}</div>`;
if(S.scene<=2)h+=`<button class="tinyGuide" data-action="tip" aria-label="Discussion notes">?</button>`;
const light=S.scene===5||S.messages;
h+=`<div class="iosIndicator ${light?'dark':''}" aria-hidden="true"></div>`;
$('#overlays').innerHTML=h}
let toastTimer=null,timerId=null,bannerTimer=null;
function flash(s){clearTimeout(toastTimer);S.toast=s;renderOverlay();toastTimer=setTimeout(()=>{S.toast='';renderOverlay()},2400)}
function advance(){if(S.messages){S.messages=false;renderOverlay();return}if(S.tips){S.tips=false;renderOverlay();return}if(S.scene<=2){const old=S.scene;S.scene++;S.banner=old;S.truth=false;S.comments=false;render();clearTimeout(bannerTimer);/* keep each Randy W. message present until presenter dismisses */}else if(S.scene===3){S.scene=4;S.banner=-1;render()}else if(S.scene<7){S.scene++;render()}}
function back(){if(S.messages){S.messages=false;renderOverlay();return}if(S.tips){S.tips=false;renderOverlay();return}S.banner=-1;S.scene=Math.max(0,S.scene-1);S.truth=false;S.comments=false;render()}
function runTimer(){if(S.seconds===0){S.scene=7;render();return}if(S.running)return;S.running=true;render();clearInterval(timerId);timerId=setInterval(()=>{S.seconds=Math.max(0,S.seconds-1);const n=$('#timerNum'),u=$('#timerUnit'),r=$('#timerOuter');if(n)n.textContent=S.seconds;if(u)u.textContent=S.seconds===0?'COMPLETE':'SECONDS';if(r)r.style.setProperty('--amount',`${((15-S.seconds)/15)*100}%`);if(S.seconds===0){S.running=false;clearInterval(timerId);let b=$('[data-action=timer]');if(b)b.textContent='Continue →'}},1000)}
function action(a,id){switch(a){case'next':advance();break;case'previous':back();break;case'truth':S.truth=!S.truth;render();break;case'comments':S.comments=!S.comments;render();break;case'like':S.like[S.scene]=!S.like[S.scene];render();break;case'share':flash('Sharing isn’t part of this demo');break;case'save':flash('Saved for later ✓');break;case'messages':S.messages=true;S.banner=-1;renderOverlay();break;case'closemessages':S.messages=false;renderOverlay();break;case'dismiss':S.banner=-1;renderOverlay();break;case'tip':S.tips=!S.tips;renderOverlay();break;case'home':S.scene=0;S.banner=-1;render();break;case'blocked':flash('Not right now · Spiritual Focus is on');break;case'search':flash('Try scrolling to the next post ↑');break;case'profile':flash('You are in demo mode');break;case'togglefocus':S.focus[Number(id)]=!S.focus[Number(id)];if(S.focus[0])S.banner=-1;render();break;case'pray':flash('Prayer: talk, then leave room to listen');break;case'openhome':S.scene=4;S.banner=-1;render();break;case'openlibrary':S.scene=5;render();break;case'backhome':S.scene=4;render();break;case'reflect':S.scene=6;render();break;case'timer':runTimer();break;case'commit':clearInterval(timerId);S.running=false;S.scene=7;render();break;case'choose':S.selection=Number(id);render();break;case'reset':clearInterval(timerId);S.scene=0;S.banner=-1;S.messages=false;S.truth=false;S.comments=false;S.focus=[false,false];S.seconds=15;S.running=false;S.selection=-1;S.tips=false;render();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();e.stopPropagation();const act=b.dataset.action;action(act,b.dataset.id);});
let touchStart=null;$('#app').addEventListener('touchstart',e=>{if(S.messages||S.tips||S.scene>2)return;if(e.touches.length!==1)return;const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});$('#app').addEventListener('touchend',e=>{if(!touchStart||S.messages||S.tips||S.scene>2)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.1){if(dy<0)advance();else back()}else if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)advance();else back()}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();advance()}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();back()}else if(e.key==='Escape'){S.messages=false;S.tips=false;S.banner=-1;renderOverlay()}else if(e.key.toLowerCase()==='r'){action('reset')}});
render();
})();
</script><script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* local browser still works */ });
  });
}
</script></body></html>
